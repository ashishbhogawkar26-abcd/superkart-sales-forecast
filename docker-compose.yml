version: '3.8'

services:
  backend:
    build: ./backend_files
    ports:
      - "7860:7860"
    networks:
      - superkart_network

  frontend:
    build: ./frontend_files
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - superkart_network

networks:
  superkart_network:
    driver: bridge
