version: '3.8'

services:
  backend:
    build: ./backend_files
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
    networks:
      - app_network

  frontend:
    build: ./frontend_files
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
